<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 100 100" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));">
  <!-- Cute Luxury Gift Bow Ribbon Vector -->
  <g stroke="#1F040C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ribbon Tail -->
    <path 
      d="M44,52 C38,62 26,76 18,84 C26,81 35,82 40,86 C45,74 48,60 49,52 Z" 
      fill="#E04858" 
    />
    <!-- Right Ribbon Tail -->
    <path 
      d="M56,52 C62,62 74,76 82,84 C74,81 65,82 60,86 C55,74 52,60 51,52 Z" 
      fill="#E04858" 
    />

    <!-- Left Bow Loop -->
    <path 
      d="M46,45 C38,32 18,22 10,34 C4,43 14,60 32,54 C40,51 46,47 48,46 Z" 
      fill="#F77885" 
    />
    <!-- Left Loop Inner Fold Highlight -->
    <path d="M22,34 C16,40 22,48 32,46" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" />
    <path d="M42,44 C34,42 26,45 22,48" fill="#D43137" stroke="none" opacity="0.35" />

    <!-- Right Bow Loop -->
    <path 
      d="M54,45 C62,32 82,22 90,34 C96,43 86,60 68,54 C60,51 54,47 52,46 Z" 
      fill="#F77885" 
    />
    <!-- Right Loop Inner Fold Highlight -->
    <path d="M78,34 C84,40 78,48 68,46" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" />
    <path d="M58,44 C66,42 74,45 78,48" fill="#D43137" stroke="none" opacity="0.35" />

    <!-- Center Knot -->
    <ellipse cx="50" cy="46" rx="9" ry="8" fill="#D43137" />
    <ellipse cx="48" cy="44" rx="4" ry="3" fill="rgba(255,255,255,0.5)" stroke="none" />
  </g>
</svg>
