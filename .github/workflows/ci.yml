name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npx vite preview --port 8080 &
          npx wait-on http://localhost:8080 --timeout 60000 || sleep 10

      - name: End-to-end tests
        id: e2e
        continue-on-error: true
        run: npm run e2e 2>&1 | tee e2e.log

      - name: SEO check
        id: seo
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run seo:check 2>&1 | tee seo.log

      - name: Summary report
        run: |
          {
            echo "## Priora CI report"
            echo ""
            echo "### End-to-end tests (\`npm run e2e\`) — ${{ steps.e2e.outcome }}"
            echo '```'
            tail -n 40 e2e.log 2>/dev/null || echo "no output"
            echo '```'
            echo "### SEO check (\`npm run seo:check\`) — ${{ steps.seo.outcome }}"
            echo '```'
            tail -n 60 seo.log 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            e2e.log
            seo.log
            playwright-report/
          if-no-files-found: ignore

      - name: Fail if any check failed
        if: steps.e2e.outcome == 'failure' || steps.seo.outcome == 'failure'
        run: exit 1
